{% load genealogy_extras %}
<!-- Single-person picker modal (shared by person1, person2, person, and relative) -->
<div id="sp-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
     z-index:1000;align-items:center;justify-content:center;">
  <div style="background:var(--card-bg);border-radius:10px;padding:24px;
              width:min(560px,92vw);max-height:80vh;display:flex;flex-direction:column;gap:12px;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <strong id="sp-modal-title">Kies persoon</strong>
      <button type="button" class="btn btn-secondary" style="padding:2px 10px;"
              onclick="spCloseModal()">✕</button>
    </div>
    <input type="text" id="sp-modal-search" placeholder="Soek naam of plek…"
           oninput="spFilter(this.value)" autocomplete="off">
    <div style="display:flex;gap:6px;align-items:center;">
      <span style="font-size:12px;color:var(--muted);">Sorteer:</span>
      <button type="button" class="btn btn-sm" id="sp-sort-first"
              onclick="spSetSort('first')"
              style="padding:2px 8px;font-size:11px;">Voornaam</button>
      <button type="button" class="btn btn-sm btn-primary" id="sp-sort-last"
              onclick="spSetSort('last')"
              style="padding:2px 8px;font-size:11px;">Van</button>
    </div>
    <div id="sp-results" style="overflow-y:auto;flex:1;display:flex;flex-wrap:wrap;gap:10px;padding:4px 0;"></div>
  </div>
</div>

<script>
(function () {
  const ALL_PEOPLE = [
    {% for p in all_people %}
    {
      id: {{ p.pk }},
      name: "{{ p.full_name|escapejs }}",
      birth_year: "{{ p.birth_year|default:'' }}",
      death_year: "{{ p.death_year|default:'' }}",
      is_deceased: {{ p.is_deceased|yesno:"true,false" }},
      birth_place: "{{ p.birth_place|escapejs }}",
      gender: "{{ p.gender }}",
      maiden_name: "{{ p.maiden_name|default:''|escapejs }}",
      henry: "{% if henry_map %}{{ henry_map|get_item:p.pk }}{% endif %}"
    }{% if not forloop.last %},{% endif %}
    {% endfor %}
  ];

  const UNCONNECTED_PEOPLE = [
    {% for p in unconnected_people %}
    {
      id: {{ p.pk }},
      name: "{{ p.full_name|escapejs }}",
      birth_year: "{{ p.birth_year|default:'' }}",
      death_year: "{{ p.death_year|default:'' }}",
      is_deceased: {{ p.is_deceased|yesno:"true,false" }},
      birth_place: "{{ p.birth_place|escapejs }}",
      gender: "{{ p.gender }}",
      maiden_name: "{{ p.maiden_name|default:''|escapejs }}",
      henry: "{% if henry_map %}{{ henry_map|get_item:p.pk }}{% endif %}"
    }{% if not forloop.last %},{% endif %}
    {% endfor %}
  ];

  const NO_HENRY_PEOPLE = [
    {% for p in no_henry_people %}
    {
      id: {{ p.pk }},
      name: "{{ p.full_name|escapejs }}",
      birth_year: "{{ p.birth_year|default:'' }}",
      death_year: "{{ p.death_year|default:'' }}",
      is_deceased: {{ p.is_deceased|yesno:"true,false" }},
      birth_place: "{{ p.birth_place|escapejs }}",
      gender: "{{ p.gender }}",
      maiden_name: "{{ p.maiden_name|default:''|escapejs }}",
      henry: "{% if henry_map %}{{ henry_map|get_item:p.pk }}{% endif %}"
    }{% if not forloop.last %},{% endif %}
    {% endfor %}
  ];

  let activeField = null;
  let activePeopleList = ALL_PEOPLE;
  let activeSortMode = 'last';

  window.spSetSort = function(mode) {
    activeSortMode = mode;
    document.getElementById('sp-sort-first').className =
      'btn btn-sm' + (mode === 'first' ? ' btn-primary' : '');
    document.getElementById('sp-sort-last').className =
      'btn btn-sm' + (mode === 'last' ? ' btn-primary' : '');
    spFilter(document.getElementById('sp-modal-search').value);
  };

  function genderClass(g) {
    return g === 'M' ? 'male' : g === 'F' ? 'female' : 'other';
  }

  function genderLabel(g) {
    return g === 'M' ? 'Manlik' : g === 'F' ? 'Vroulik' : 'Ander';
  }

  function renderCard(p, clickable) {
    const card = document.createElement('div');
    card.className = 'pcard';
    card.style.cssText = 'min-width:140px;max-width:180px;' + (clickable ? 'cursor:pointer;' : 'cursor:default;position:relative;');
    card.innerHTML =
      (p.henry ? '<div style="font-size:10px;font-family:monospace;color:var(--muted);margin-bottom:2px;">' + p.henry + '</div>' : '') +
      '<div class="pcard-name">' + p.name + (p.maiden_name ? ' <span style="font-weight:400;color:var(--muted);">(nee ' + p.maiden_name + ')</span>' : '') + '</div>' +
      '<div class="pcard-dates" style="font-size:11px;">' +
        (p.birth_year ? 'geb. ' + p.birth_year : '') +
        (p.is_deceased && p.death_year ? ' – gest. ' + p.death_year : '') +
      '</div>' +
      (p.birth_place ? '<div style="font-size:11px;color:var(--muted);">' + p.birth_place + '</div>' : '') +
      '<span class="badge badge-' + genderClass(p.gender) + '" style="margin-top:4px;">' +
        genderLabel(p.gender) +
      '</span>';
    return card;
  }

  window.spOpen = function (fieldName) {
    activeField = fieldName;
    activePeopleList = ALL_PEOPLE;
    document.getElementById('sp-modal').style.display = 'flex';
    const inp = document.getElementById('sp-modal-search');
    inp.value = '';
    spFilter('');
    inp.focus();
  };

  window.spOpenSpouse = function (fieldName, mode) {
    activeField = fieldName;
    activePeopleList = (mode === 'no_henry') ? NO_HENRY_PEOPLE : ALL_PEOPLE;
    const title = document.getElementById('sp-modal-title');
    if (title) title.textContent = mode === 'no_henry' ? 'Kies gade (sonder Henry nr.)' : 'Kies gade (almal)';
    document.getElementById('sp-modal').style.display = 'flex';
    const inp = document.getElementById('sp-modal-search');
    inp.value = '';
    spFilter('');
    inp.focus();
  };

  window.spOpenRelative = function (mode) {
    activeField = 'relative';
    activePeopleList = (mode === 'unconnected') ? UNCONNECTED_PEOPLE : ALL_PEOPLE;
    const title = document.getElementById('sp-modal-title');
    if (title) title.textContent = mode === 'unconnected' ? 'Kies kind (onverbind)' : 'Kies kind (almal)';
    document.getElementById('sp-modal').style.display = 'flex';
    const inp = document.getElementById('sp-modal-search');
    inp.value = '';
    spFilter('');
    inp.focus();
  };

  window.spCloseModal = function () {
    document.getElementById('sp-modal').style.display = 'none';
    activeField = null;
  };

  window.spClear = function (fieldName) {
    document.getElementById(fieldName + '-value').value = '';
    document.getElementById(fieldName + '-selected').innerHTML = '';
  };

  window.spFilter = function (q) {
    const results = document.getElementById('sp-results');
    const lower   = q.toLowerCase();
    const matches = activePeopleList.filter(function (p) {
      return p.name.toLowerCase().includes(lower) ||
             p.birth_place.toLowerCase().includes(lower) ||
             p.maiden_name.toLowerCase().includes(lower);
    });

    // Sort matches
    matches.sort(function(a, b) {
      if (activeSortMode === 'first') {
        return a.name.localeCompare(b.name);
      } else {
        // Sort by last word (surname) then first name
        var aLast = a.name.split(' ').slice(-1)[0];
        var bLast = b.name.split(' ').slice(-1)[0];
        if (aLast !== bLast) return aLast.localeCompare(bLast);
        return a.name.localeCompare(b.name);
      }
    });

    results.innerHTML = '';
    matches.forEach(function (p) {
      const card = renderCard(p, true);
      card.addEventListener('click', function () {
        if (!activeField) return;

        // Set hidden value
        document.getElementById(activeField + '-value').value = p.id;

        // Render selected card
        const box  = document.getElementById(activeField + '-selected');
        const full = renderCard(p, false);
        const btn  = document.createElement('button');
        btn.type      = 'button';
        btn.innerHTML = '✕';
        btn.style.cssText = 'position:absolute;top:4px;right:4px;background:none;border:none;cursor:pointer;font-size:13px;color:var(--muted);';
        btn.onclick = (function (fn) {
          return function () { spClear(fn); };
        })(activeField);
        full.appendChild(btn);
        box.innerHTML = '';
        box.appendChild(full);

        spCloseModal();
      });
      results.appendChild(card);
    });

    if (matches.length === 0) {
      results.innerHTML = '<p style="color:var(--muted);font-size:13px;">Geen mense gevind nie.</p>';
    }
  };

  // Close on overlay click
  document.getElementById('sp-modal').addEventListener('click', function (e) {
    if (e.target === this) spCloseModal();
  });

  // Wire up the search inputs above each picker to open the modal
  ['person1', 'person2', 'person', 'relative'].forEach(function (fn) {
    const inp = document.getElementById(fn + '-search');
    if (inp) {
      inp.addEventListener('input', function () {
        spOpen(fn);
        document.getElementById('sp-modal-search').value = this.value;
        spFilter(this.value);
      });
    }
  });
})();
</script>
