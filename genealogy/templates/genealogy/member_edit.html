{% extends "genealogy/base.html" %}
{% block title %}Wysig Lid — Van Eeden Familiegeskiedenis{% endblock %}
{% block breadcrumb %}
  <a href="{% url 'genealogy:dashboard' %}">Tuiste</a> <span>›</span>
  <a href="{% url 'genealogy:members_list' %}">Lede</a> <span>›</span> Wysig
{% endblock %}
{% block content %}
<div class="ph"><div><h2>Wysig Lid</h2><p class="subtitle">{{ tp.user.username }}</p></div></div>
<div class="card" style="max-width:480px;">
  <form method="post">{% csrf_token %}
    <div class="fg" style="margin-bottom:14px;">
      <label>Voornaam</label>
      <input type="text" name="first_name" value="{{ tp.user.first_name }}">
    </div>
    <div class="fg" style="margin-bottom:14px;">
      <label>Van</label>
      <input type="text" name="last_name" value="{{ tp.user.last_name }}">
    </div>
    <div class="fg" style="margin-bottom:14px;">
      <label>E-pos</label>
      <input type="email" name="email" value="{{ tp.user.email }}">
    </div>
    <div class="fg" style="margin-bottom:14px;">
      <label>Rol</label>
      <select name="role">
        {% for value, display in role_choices %}
          <option value="{{ value }}" {% if tp.role == value %}selected{% endif %}>{{ display }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="fg" style="margin-bottom:14px;">
      <label>Verbinding / Bio</label>
      <textarea name="bio" rows="3">{{ tp.bio }}</textarea>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">💾 Stoor</button>
      <a href="{% url 'genealogy:members_list' %}" class="btn btn-secondary">Kanselleer</a>
    </div>
  </form>
</div>
{% endblock %}
