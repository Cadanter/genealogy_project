{% extends "blog/base.html" %}
{% block title %}Verwyder plasing{% endblock %}
{% block content %}
<div style="max-width:460px;margin:60px auto;padding:0 24px;text-align:center;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:36px;">
    <p style="font-size:28px;margin-bottom:12px;">⚠️</p>
    <h2 style="font-family:'EB Garamond',serif;font-size:22px;color:var(--cream);margin-bottom:10px;">Verwyder "{{ post.title }}"?</h2>
    <p style="font-size:13px;color:var(--muted);margin-bottom:24px;">Hierdie plasing en al sy kommentare word permanent verwyder.</p>
    <form method="post" style="display:flex;gap:10px;justify-content:center;">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Ja, verwyder</button>
      <a href="{{ post.get_absolute_url }}" class="btn btn-secondary">Kanselleer</a>
    </form>
  </div>
</div>
{% endblock %}
